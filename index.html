<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nachtfalter // Personal Command Center</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 300px;
            background-color: var(--card-bg);
            border-right: 1px solid #334155;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-shrink: 0;
        }

        .status-badge {
            background: #064e3b;
            color: var(--accent-green);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
        }

        .abo-card {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-purple);
            font-size: 0.9rem;
        }

        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
        }

        header {
            padding: 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mode-switch {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .switch {
            position: relative;
            width: 50px;
            height: 26px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155;
            transition: .3s;
            border-radius: 26px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px; width: 20px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-purple);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.5;
        }

        .user-msg {
            background-color: var(--accent-purple);
            align-self: flex-end;
        }

        .bot-msg {
            background-color: var(--card-bg);
            align-self: flex-start;
            border: 1px solid #334155;
        }

        #input-area {
            padding: 20px;
            border-top: 1px solid #334155;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid #334155;
            padding: 14px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-purple);
        }

        button {
            background: var(--accent-purple);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { opacity: 0.9; }

        .watchdog {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .watchdog strong { color: var(--accent-green); }
    </style>
</head>
<body>
    <div id="sidebar">
        <div>
            <span class="status-badge">● Online</span>
        </div>
        <div class="abo-card">
            <strong>Grok Experten</strong><br>
            Testphase: 14 Tage übrig
        </div>
        <div class="abo-card">
            <strong>Groq Gratis</strong><br>
            Unbegrenzt (Llama-3)
        </div>
        <div class="watchdog">
            <strong>Watchdog aktiv</strong><br>
            Nächste Prüfung in 18h
        </div>
    </div>

    <div id="chat-container">
        <header>
            <div>
                <h2 style="margin:0;">Nachtfalter</h2>
                <small style="color:var(--text-muted);">Personal Command Center</small>
            </div>
            <div class="mode-switch">
                <span id="mode-label">Gratis-Modus</span>
                <label class="switch">
                    <input type="checkbox" id="mode-toggle">
                    <span class="slider"></span>
                </label>
            </div>
        </header>

        <div id="messages">
            <div class="message bot-msg">Willkommen in der Nachtfalter-Schaltzentrale. Wie kann ich helfen?</div>
        </div>

        <div id="input-area">
            <input type="text" id="user-input" placeholder="Nachricht eingeben…" autofocus>
            <button id="send-btn">Senden</button>
        </div>
    </div>

    <script>
        const messages = document.getElementById('messages');
        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const toggle = document.getElementById('mode-toggle');
        const modeLabel = document.getElementById('mode-label');

        toggle.addEventListener('change', () => {
            modeLabel.textContent = toggle.checked ? 'Experten-Modus' : 'Gratis-Modus';
        });

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = 'message ' + (isUser ? 'user-msg' : 'bot-msg');
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function send() {
            const text = input.value.trim();
            if (!text) return;
            addMessage(text, true);
            input.value = '';

            // Placeholder – hier später dein Gateway/API anbinden
            const mode = toggle.checked ? 'Grok (Experte)' : 'Llama-3 (Gratis)';
            setTimeout(() => {
                addMessage(`Antwort via ${mode}: Ich habe deine Nachricht erhalten.`, false);
            }, 400);
        }

        sendBtn.addEventListener('click', send);
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter') send();
        });
    </script>
</body>
</html>
